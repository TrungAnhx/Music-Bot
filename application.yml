server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    bufferDurationMs: 1000
    frameBufferDurationMs: 1000
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

plugins:
  youtube:
    enabled: true
    # Tối ưu hóa client để tìm nhạc nhanh hơn và tránh bị chặn
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    allowSearch: true
    # Sử dụng file cookies.txt để xác thực
    # Lưu ý: file này phải nằm trong cùng thư mục với Lavalink.jar (thư mục /app trong Docker)
    # Tuy nhiên, plugin youtube hiện tại yêu cầu OAuth hoặc cấu hình qua tham số khác.
    # Ta sẽ cấu hình yt-dlp trong code chính trước.

logging:
  file:
    max-size: 1GB
    path: ./logs/

  level:
    root: INFO
