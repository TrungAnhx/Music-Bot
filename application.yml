server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    bufferDurationMs: 1000
    frameBufferDurationMs: 1000
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

plugins:
  youtube:
    enabled: true
    # Tối ưu hóa client để tìm nhạc nhanh hơn và tránh bị chặn
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    allowSearch: true

logging:
  file:
    max-size: 1GB
    path: ./logs/

  level:
    root: INFO
